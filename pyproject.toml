[project]
name = "counter-family-phase-lm"
version = "0.1.0"
description = "Perf-based counter-family phase language-modeling pipeline."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
teacher = [
    "torch>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hpc_phase_analysis", "phase_family_ml"]

[tool.uv]
package = true
